name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism_oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prism_oracle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:prism@localhost:5432/prism_oracle?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go tests
        run: go test ./...
      - name: Python generator smoke
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/generate_data.py --scale testdata --out /tmp/prism-testdata
          go run ./cmd/prism inspect --data-dir /tmp/prism-testdata --table events
          go run ./cmd/prism tables --data-dir /tmp/prism-testdata
          go run ./cmd/prism describe events --data-dir /tmp/prism-testdata
          go run ./cmd/prism describe events --json --data-dir /tmp/prism-testdata
          go run ./cmd/prism scan --data-dir /tmp/prism-testdata --table events --columns country,amount_cents --limit 5
          go run ./cmd/prism scan --data-dir /tmp/prism-testdata --table events --where "amount_cents > 0 AND country = 'US'" --columns country,amount_cents --limit 5
          python scripts/filter_oracle.py --data-dir testdata/tables --expect 30
          python scripts/filter_oracle.py --data-dir /tmp/prism-testdata --expect 30
          go run ./cmd/prism agg --data-dir testdata/tables --table events --group country --agg 'count,sum(amount_cents)' --order count --desc --limit 5
          go run ./cmd/prism sql --data-dir testdata/tables "SELECT COUNT(*) FROM events"
          go run ./cmd/prism sql --data-dir testdata/tables --file testdata/sql/ok/resume.sql
          go run ./cmd/prism explain --data-dir testdata/tables --file testdata/sql/ok/q2.sql
          go run ./cmd/prism sql --engine=row --jobs=1 --data-dir testdata/tables --file testdata/sql/ok/q1.sql
          go run ./cmd/prism sql --jobs=4 --data-dir testdata/tables --file testdata/sql/ok/q1.sql
          python scripts/agg_oracle.py --data-dir testdata/tables
          python scripts/verify_manifest.py --data-dir testdata/tables
          python scripts/verify_manifest.py --data-dir /tmp/prism-testdata
      - name: Postgres oracle (testdata + tiny)
        run: |
          python scripts/load_postgres.py --scale testdata
          python scripts/verify_against_postgres.py --scale testdata
          python scripts/generate_data.py --scale tiny --out /tmp/prism-tiny
          python scripts/verify_manifest.py --data-dir /tmp/prism-tiny
          python scripts/load_postgres.py --scale tiny --data-dir /tmp/prism-tiny
          python scripts/verify_against_postgres.py --scale tiny --data-dir /tmp/prism-tiny
      - name: Bench harness smoke
        run: |
          go run ./cmd/prism bench --scale testdata --engine all --repeat 3 --out /tmp/prism-bench.json
          go run ./bench --scale testdata --engine vectorized --repeat 1 --breakdown=false
      - name: prismd smoke
        run: |
          go run ./cmd/prismd --listen 127.0.0.1:18080 --data-dir testdata/tables --timeout 30s &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:18080/health && break; sleep 0.2; done
          curl -sf http://127.0.0.1:18080/tables >/dev/null
          curl -sf -X POST http://127.0.0.1:18080/query \
            -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT country, COUNT(*) FROM events GROUP BY country ORDER BY COUNT(*) DESC LIMIT 5","explain":true}'

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go tests
        run: go test ./...
      - name: Python generator smoke
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/generate_data.py --scale testdata --out /tmp/prism-testdata
          go run ./cmd/prism inspect --data-dir /tmp/prism-testdata --table events
          go run ./cmd/prism tables --data-dir /tmp/prism-testdata
          go run ./cmd/prism describe events --data-dir /tmp/prism-testdata
          go run ./cmd/prism scan --data-dir /tmp/prism-testdata --table events --columns country,amount_cents --limit 5
          go run ./cmd/prism scan --data-dir /tmp/prism-testdata --table events --where "amount_cents > 0 AND country = 'US'" --columns country,amount_cents --limit 5
          python scripts/filter_oracle.py --data-dir testdata/tables --expect 30
          python scripts/filter_oracle.py --data-dir /tmp/prism-testdata --expect 30
          go run ./cmd/prism agg --data-dir testdata/tables --table events --group country --agg 'count,sum(amount_cents)' --order count --desc --limit 5
          go run ./cmd/prism sql --data-dir testdata/tables "SELECT COUNT(*) FROM events"
          go run ./cmd/prism sql --data-dir testdata/tables --file testdata/sql/ok/resume.sql
          go run ./cmd/prism explain --data-dir testdata/tables --file testdata/sql/ok/q2.sql
          python scripts/agg_oracle.py --data-dir testdata/tables

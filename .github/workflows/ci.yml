name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go tests
        run: go test ./...
      - name: Python generator smoke
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/generate_data.py --scale testdata --out /tmp/prism-testdata
          go run ./cmd/prism inspect --data-dir /tmp/prism-testdata --table events
          go run ./cmd/prism scan --data-dir /tmp/prism-testdata --table events --columns country,amount_cents --limit 5
